<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up World Terminal</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/></svg>
        World Terminal
      </div>
      <div class="top-right">
        <span id="step-count" class="step-count"></span>
        <button id="skip" class="link">Skip setup</button>
      </div>
    </header>

    <main class="layout">
      <section class="left">
        <ol class="stepper" id="stepper" aria-label="Setup steps"></ol>
        <div class="panel" id="panel" aria-live="polite"></div>
      </section>

      <aside class="right" aria-label="Live preview">
        <div class="device">
          <div class="device-bar">
            <span class="dots"><i></i><i></i><i></i></span>
            <span class="device-title">World Terminal</span>
            <span class="live-pill" id="preview-pill">Preview</span>
          </div>
          <iframe id="preview" src="app.html" title="World Terminal preview" tabindex="-1"></iframe>
        </div>
        <p class="preview-caption" id="preview-caption">This is the real extension. It fills in as you finish each step.</p>
      </aside>
    </main>

    <script type="module" src="welcome.js"></script>
  </body>
</html>
