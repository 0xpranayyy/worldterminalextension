name = "world-terminal-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Poll the upstream market feed every minute.
[triggers]
crons = ["* * * * *"]

[vars]
# Your World invite code and (optionally) wallet. Pro = wallet whose referredBy matches either.
REFERRAL_CODE = ""
REFERRER_WALLET = ""
FREE_ROW_LIMIT = "10"
# Market feed in World's /events format. Needs official access (World partner API or DFlow
# prediction-markets API key) set as the UPSTREAM_TOKEN secret. Empty = poller stays idle.
UPSTREAM_URL = ""
USERS_API_URL = "https://users-api.world.xyz/api/v1"
# Signal bot: posts new arbitrage of at least this many cents to Telegram/Discord.
BROADCAST_MIN_EDGE_CENTS = "1"
# Chrome Web Store link included in bot posts (optional).
EXTENSION_STORE_URL = ""
# Extension origins allowed to receive sessions from /connect (chrome-extension://<id>), comma-separated.
EXTENSION_IDS = ""

# Secrets (set with `wrangler secret put NAME`):
#   SESSION_SECRET   random 32+ byte string used to sign session tokens (required)
#   UPSTREAM_TOKEN   bearer token for UPSTREAM_URL (optional)
#   USERS_API_TOKEN  bearer token for USERS_API_URL; without it the user's own World session is used
#   TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID   post signals to a Telegram channel (optional)
#   DISCORD_WEBHOOK_URL                      post signals to a Discord channel (optional)

[[d1_databases]]
binding = "DB"
database_name = "world-terminal"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# Per-IP / per-wallet request limits (windows must be 10 or 60 seconds).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 120
  period = 60
