<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Terminal</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="hdr">
        <div class="brand">
          <span class="logo-tile" aria-hidden="true">
            <svg class="logo" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
              <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M3 12h18" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </span>
          <span class="brand-name">World Terminal</span>
          <span id="plan"></span>
        </div>
        <div class="hdr-actions">
          <button class="icon-btn" id="btn-refresh" title="Refresh now (R)" aria-label="Refresh now"></button>
          <button class="icon-btn" id="btn-panel" title="Open in side panel" aria-label="Open in side panel"></button>
          <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings"></button>
        </div>
      </header>

      <div class="tape" id="tape" hidden></div>

      <div class="kpis" id="kpis"></div>

      <div id="banner"></div>

      <div id="context" hidden></div>

      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="markets">Markets</button>
        <button role="tab" data-tab="signals">Signals <span class="count" id="count-signals"></span></button>
        <button role="tab" data-tab="watch">Watchlist <span class="count" id="count-watch"></span></button>
        <button role="tab" data-tab="portfolio">Portfolio</button>
        <span class="tab-ink" id="tab-ink"></span>
      </nav>

      <div class="toolbar" id="toolbar-markets">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search markets" autocomplete="off" />
          <kbd>/</kbd>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="liquidity">Liquidity</option>
          <option value="spread">Tightest spread</option>
          <option value="volume">Volume</option>
          <option value="openInterest">Open interest</option>
          <option value="closing">Closing soon</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chips" id="signal-chips" hidden></div>

      <main class="scroll" id="scroll">
        <div id="view"></div>
      </main>

      <footer class="statusbar" id="live" aria-live="polite"></footer>
    </div>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
